server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # перед nginx стоит Traefik с HTTPS: редиректы отдаём относительными, без своей схемы и порта
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ассеты Astro с хэшем в имени — кэшируем навсегда
  location ~* ^/_astro/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # шрифты не меняются
  location ~* \.(woff|woff2|ttf|otf)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
  }
  # Картинки слоёв лежат под постоянными именами (/img/s4-dc-xl.webp) и меняются от деплоя к деплою.
  # Браузер держит их в кэше, но перед использованием сверяется с сервером (304, если файл тот же):
  # после деплоя никто не увидит новую сцену со старыми слоями.
  location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
