# с отпечатком (?v=) — навсегда, без него — со сверкой (см. location /img/ ниже)
map $arg_v $img_cache {
  ""      "no-cache";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  # перед nginx стоит Traefik с HTTPS: редиректы отдаём относительными, без своей схемы и порта
  absolute_redirect off;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # ассеты Astro с хэшем в имени — кэшируем навсегда
  location ~* ^/_astro/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # шрифты не меняются
  location ~* \.(woff|woff2|ttf|otf)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=2592000";
  }
  # Картинки слоёв, ролики и их заставки сайт запрашивает с отпечатком содержимого (/img/s4-dc-xl.webp?v=…,
  # build-images.mjs; /video/lab-mesh.mp4?v=…, build-video.mjs): такой адрес не меняется, пока не изменился файл, —
  # кэшируем навсегда, без перепроверок. Каждая перепроверка — это лишний запрос к серверу, а у далёких
  # посетителей их десятки на загрузку.
  location ~* ^/img/.+\.webp$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control $img_cache;
  }
  # запросы роликов остаются в журнале: по нему видно, докачался ли ролик у посетителя (вместе с /__diag)
  location ~* ^/video/.+\.(webp|mp4)$ {
    try_files $uri =404;
    add_header Cache-Control $img_cache;
  }
  # Остальные картинки лежат под постоянными именами: браузер сверяется с сервером перед использованием.
  location ~* \.(webp|avif|png|jpg|jpeg|gif|svg|ico)$ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
